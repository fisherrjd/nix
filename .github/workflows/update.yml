name: check for flake updates
on: {workflow_dispatch, schedule: [cron: '0 4 * * *']}
jobs:
  check-for-updates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://cache.g7c.us
            extra-trusted-public-keys = cache.g7c.us:dSWpE2B5zK/Fahd7npIQWM4izRnVL+a4LiCAnrjdoFY=
      - run: nix flake update
      # fisherrjd-nix-ci app token: unlike GITHUB_TOKEN, PRs it opens still trigger the build workflow
      - uses: actions/create-github-app-token@v3.2.0
        id: app
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: peter-evans/create-pull-request@v8.1.0
        id: pr
        with:
          delete-branch: true
          author: Jade Fisher <dev@Jade.rip>
          title: automatic update
          commit-message: automatic update
          branch: automatic-update
          token: ${{ steps.app.outputs.token }}
      - if: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge --auto --squash ${{ steps.pr.outputs.pull-request-url }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
